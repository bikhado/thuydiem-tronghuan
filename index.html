<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thiệp Cưới | Thúy Diễm 💕 Trọng Huân</title>
    <meta name="description" content="Sự hiện diện của quý vị là niềm vinh hạnh lớn nhất của gia đình chúng tôi!" />
    <meta property="og:title" content="Save The Date | Đám cưới Thúy Diễm ❤️ Trọng Huân" />
    <meta property="og:description" content="Trân trọng kính mời quý vị đến dự tiệc chung vui cùng gia đình chúng tôi. Bấm vào đây để xem chi tiết thiệp cưới và gửi lời chúc nhé 💌" />
    <meta property="og:url" content="https://thiepcuoi-thuydiem-tronghuan.vercel.app">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://bikhado.github.io/thuydiem-tronghuan/images/f68e05b9-48ee-4b3a-95a3-e9efea5cbecd.jpg">
    <meta property="og:image:alt" content="Hình cưới Thúy Diễm và Trọng Huân">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:site_name" content="Kỷ Niệm Ngày Cưới - Thúy Diễm & Trọng Huân" />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            background-color: #fdfaf6;
            color: #5d4b46;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }

        .container {
            background-color: #ffffff;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.05);
            max-width: 90%;
            width: 450px;
            border: 1px solid #f0e6d6;
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: '🌸';
            position: absolute;
            top: -20px;
            left: -20px;
            font-size: 80px;
            opacity: 0.1;
            transform: rotate(-15deg);
        }

        .container::after {
            content: '🌸';
            position: absolute;
            bottom: -20px;
            right: -20px;
            font-size: 80px;
            opacity: 0.1;
            transform: rotate(165deg);
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            color: #baa58a;
            margin-bottom: 10px;
        }

        p {
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #baa58a;
            color: #fff;
            text-decoration: none;
            padding: 15px 20px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 500;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(186, 165, 138, 0.3);
            border: 2px solid #baa58a;
        }

        .btn:hover {
            background-color: #fff;
            color: #baa58a;
            transform: translateY(-2px);
        }

        .btn span.date {
            font-size: 0.85rem;
            opacity: 0.9;
            margin-left: 8px;
            font-weight: 400;
        }

        .btn.btn-outline {
            background-color: transparent;
            color: #baa58a;
        }

        .btn.btn-outline:hover {
            background-color: #baa58a;
            color: #fff;
        }

        .timer {
            font-size: 0.9rem;
            color: #888;
            background-color: #f9f9f9;
            padding: 10px 15px;
            border-radius: 10px;
            display: inline-block;
        }

        .heart {
            color: #df9e9e;
            font-size: 1.2rem;
            animation: beat 1s infinite alternate;
        }

        @keyframes beat {
            to { transform: scale(1.2); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Thúy Diễm <span class="heart">♥</span> Trọng Huân</h1>
        <p>Thân mời bạn đến chung vui cùng gia đình chúng mình.<br>Vui lòng lựa chọn thiệp mời để xem chi tiết nhé!</p>

        <div class="btn-group">
            <a href="nhagai.html" class="btn">
                Mời dự tiệc Nhà Gái <span class="date">(22.03.2026)</span>
            </a>
            <a href="nhatrai.html" class="btn btn-outline">
                Mời dự tiệc Nhà Trai <span class="date">(04.04.2026)</span>
            </a>
        </div>

        <div class="timer" id="auto-redirect-msg">
            Đang tự động chuyển hướng trong <strong id="countdown-sec">10</strong>s...
        </div>
    </div>

    <script>
        // Target dates
        const dateNhaGai = new Date('2026-03-22T00:00:00').getTime();
        const dateNhaTrai = new Date('2026-04-04T00:00:00').getTime();
        const now = new Date().getTime();

        let targetUrl = 'nhagai.html'; // Default
        let targetName = 'Nhà Gái';

        if (now > dateNhaGai && now <= dateNhaTrai) {
            targetUrl = 'nhatrai.html';
            targetName = 'Nhà Trai';
        }

        let secondsLeft = 10;
        const countSpan = document.getElementById('countdown-sec');
        const msgDiv = document.getElementById('auto-redirect-msg');
        
        msgDiv.innerHTML = `Sẽ tự động chuyển đến thiệp <strong>${targetName}</strong> sau <strong border="1" style="color:#baa58a;" id="countdown-sec">${secondsLeft}</strong>s...`;

        const interval = setInterval(() => {
            secondsLeft--;
            const cspan = document.getElementById('countdown-sec');
            if (cspan) cspan.innerText = secondsLeft;

            if (secondsLeft <= 0) {
                clearInterval(interval);
                window.location.href = targetUrl;
            }
        }, 1000);
    </script>
</body>
</html>
